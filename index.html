<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Мой ИИ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">

  <div id="overlay" class="overlay"></div>

  <div id="sidebar" class="sidebar">
    <button id="new-chat" class="new-chat">+ Новый чат</button>
    <div id="chat-list" class="chat-list"></div>
    <div class="sidebar-bottom">
      <button id="settings-btn" class="settings-btn">⚙️ Настройки</button>
    </div>
  </div>

  <div id="settings-screen" class="settings-screen hidden">
    <div class="settings-header">
      <button id="back-btn" class="back-btn">←</button>
      <span>Настройки</span>
    </div>
    <div class="settings-body">
      <div class="setting-item">
        <span>🌙 Тёмная тема</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <header>
    <button id="menu-btn" class="icon-btn" aria-label="Меню">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <div class="header-right">
      <button id="new-chat-top" class="icon-btn" aria-label="Новый чат">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          <line x1="9" y1="11" x2="15" y2="11"/>
        </svg>
      </button>
      <button id="more-btn" class="icon-btn" aria-label="Ещё">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <circle cx="5" cy="12" r="1.8"/>
          <circle cx="12" cy="12" r="1.8"/>
          <circle cx="19" cy="12" r="1.8"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="chat"></div>
    <div id="welcome" class="welcome">
      <img src="icon-192.png" alt="AI" class="welcome-logo">
      <p class="welcome-text">Привет! Я языковая ИИ модель,<br>введи любой вопрос, а я отвечу</p>
    </div>
  </main>

  <div class="input-bar">
    <button id="attach-btn" class="circle-btn" aria-label="Прикрепить">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
    <input id="msg" placeholder="Введите сообщение" autocomplete="off">
    <button id="send" class="circle-btn" aria-label="Отправить">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
