<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой ИИ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light">

  <!-- ЗАТЕМНЕНИЕ -->
  <div id="overlay" class="overlay"></div>

  <!-- БОКОВОЕ МЕНЮ -->
  <div id="sidebar" class="sidebar">
    <button id="new-chat" class="new-chat">+ Новый чат</button>
    <div id="chat-list" class="chat-list"></div>
    <div class="sidebar-bottom">
      <button id="settings-btn" class="settings-btn">⚙️ Настройки</button>
    </div>
  </div>

  <!-- ЭКРАН НАСТРОЕК -->
  <div id="settings-screen" class="settings-screen hidden">
    <div class="settings-header">
      <button id="back-btn" class="back-btn">←</button>
      <span>Настройки</span>
    </div>
    <div class="settings-body">
      <div class="setting-item">
        <span>🌙 Тёмная тема</span>
        <label class="switch">
          <input type="checkbox" id="theme-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- ШАПКА -->
  <header>
    <button id="menu-btn" class="icon-btn" aria-label="Меню">☰</button>
    <button id="new-chat-top" class="icon-btn" aria-label="Новый чат">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        <line x1="12" y1="8" x2="12" y2="14"/>
        <line x1="9" y1="11" x2="15" y2="11"/>
      </svg>
    </button>
  </header>

  <!-- ЧАТ -->
  <div id="chat"></div>

  <!-- ПОЛЕ ВВОДА -->
  <div class="input-bar">
    <input id="msg" placeholder="Введите сообщение" autocomplete="off">
    <button id="send" aria-label="Отправить">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
